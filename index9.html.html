<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phiếu học tập tương tác</title>
<style>
:root{
  --bg1:#eef4ff;--bg2:#f7f2ff;--card:#fff;--primary:#5b5bd6;--primary2:#7c3aed;
  --text:#1f2937;--muted:#64748b;--line:#dbe2f0;--good:#15803d;--goodbg:#dcfce7;
  --bad:#b91c1c;--badbg:#fee2e2;--warn:#92400e;--warnbg:#fef3c7;--soft:#eef2ff
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:linear-gradient(135deg,var(--bg1),var(--bg2))}
.wrap{width:min(1000px,94%);margin:22px auto 70px}
.hero{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-radius:22px;padding:28px 22px;box-shadow:0 16px 40px rgba(91,91,214,.18)}
.hero h1{margin:0 0 8px;font-size:clamp(25px,5vw,40px);line-height:1.15} .hero p{margin:0;opacity:.95}
.student{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-top:18px}
.student input{width:100%;padding:12px;border:0;border-radius:12px;font-size:16px}
.card{background:var(--card);border:1px solid rgba(91,91,214,.12);border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 8px 26px rgba(15,23,42,.06)}
.card h2{margin:0 0 14px;color:#4338ca;font-size:22px}
.tag{display:inline-block;background:rgba(255,255,255,.18);color:#fff;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:700;margin-bottom:10px}
.q{padding:14px 0;border-bottom:1px dashed var(--line)} .q:last-child{border-bottom:0} .q strong{display:block;margin-bottom:8px}
.option{display:block;padding:10px 11px;margin:7px 0;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:.18s;background:#fff}
.option:hover{background:#f8faff;border-color:#c7d2fe} .option.correct{background:var(--goodbg);border-color:#86efac;color:#166534}
.option.wrong{background:var(--badbg);border-color:#fecaca;color:#991b1b} .option.locked{cursor:default}
input[type="radio"]{margin-right:8px}
input[type="text"],textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff}
textarea{min-height:86px;resize:vertical} .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.feedback{font-size:14px;font-weight:700;margin-top:7px} .correct-text{color:var(--good)} .wrong-text{color:var(--bad)}
.note{font-size:14px;color:var(--muted)} .match-row{display:grid;grid-template-columns:1.1fr 1fr;gap:10px;align-items:center;margin:10px 0}
.actions{position:sticky;bottom:8px;z-index:10;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:12px;margin-top:18px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border:1px solid #e2e8f0;border-radius:18px}
button{border:0;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff} .secondary{background:#eef2ff;color:#4338ca}
.danger{background:#fee2e2;color:#991b1b} .checkbtn{background:#e0e7ff;color:#3730a3;margin-top:8px}
#result{display:none;margin-top:16px;padding:18px;border-radius:16px;font-weight:700} .ok{background:var(--goodbg);color:#166534}
.warn{background:var(--warnbg);color:var(--warn)} .bad{background:var(--badbg);color:#991b1b}
.drag-area{display:grid;grid-template-columns:1fr 1.4fr;gap:18px;align-items:start}
.bank{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:14px;min-height:220px}
.bank h3,.targets h3{margin:0 0 10px;color:#4f46e5}
.chip{user-select:none;background:linear-gradient(135deg,#eef2ff,#f5f3ff);border:2px solid #c7d2fe;color:#312e81;border-radius:14px;padding:11px 12px;margin:9px 0;font-weight:700;cursor:grab;box-shadow:0 4px 12px rgba(79,70,229,.08)}
.chip.selected{outline:3px solid #818cf8} .chip.locked{opacity:.65;cursor:not-allowed;background:#ecfdf5;border-color:#86efac;color:#166534}
.dropzone{min-height:72px;border:2px dashed #cbd5e1;border-radius:14px;padding:12px;margin:10px 0;background:#fff;transition:.18s}
.dropzone.dragover{border-color:#6366f1;background:#eef2ff} .dropzone.correct{border-style:solid;border-color:#86efac;background:#f0fdf4}
.drop-title{font-weight:700;margin-bottom:6px} .drop-slot{min-height:32px;color:#64748b}
.success-pop{display:none;margin-top:12px;padding:12px;border-radius:12px;background:#dcfce7;color:#166534;font-weight:800;text-align:center;animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.9);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .3s ease} @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.footer{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
@media(max-width:720px){.student,.grid2,.match-row,.drag-area{grid-template-columns:1fr}.card{padding:16px}.wrap{width:min(96%,1000px);margin-top:10px}.actions{bottom:5px}button{width:100%}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>

<!-- =========================================================
     CHỈNH NỘI DUNG BÀI HỌC Ở KHỐI JSON NÀY.

     ========================================================= -->
<script type="application/json" id="lesson-data">

        },

<script>
/* =========================================================
   KHUNG GIAO DIỆN + CHỨC NĂNG DÙNG CHUNG
   Giữ cố định. Chỉ đọc dữ liệu từ #lesson-data.
   ========================================================= */

const DATA = JSON.parse(document.getElementById("lesson-data").textContent);
const app = document.getElementById("app");
const state = {selectedChip:null};

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
}
function norm(s){
  return (s||"").toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ");
}
function autoSections(){ return DATA.sections.filter(s=>DATA.scoring.autoGradedTypes.includes(s.type)); }
function totalAutoItems(){ return autoSections().reduce((n,s)=>n+s.items.length,0); }

function render(){
  let html = `
    <section class="hero">
      <div class="tag">${esc(DATA.meta.subject)}</div>
      <h1>${esc(DATA.meta.title)}</h1>
      <p>${esc(DATA.meta.subtitle)}</p>
      <div class="student">
        ${DATA.meta.studentFields.map((x,i)=>`<input id="student_${i}" type="text" placeholder="${esc(x)}">`).join("")}
      </div>
    </section>

    <section class="card">
      <h2>🎯 Mục tiêu bài học</h2>
      <ul>${DATA.objectives.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    </section>

    <section class="card">
      <h2>🔵 ${esc(DATA.warmup.title)}</h2>
      <p>${esc(DATA.warmup.prompt)}</p>
      <label>${esc(DATA.warmup.question)}</label>
      <textarea id="warmup"></textarea>
    </section>
  `;

  DATA.sections.forEach(sec=> html += renderSection(sec));

  html += `
    <section class="card">
      <h2>💜 Ghi nhớ cuối bài</h2>
      <ul>${DATA.memory.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    </section>

    <section class="card">
      <h2>🚀 Exit Ticket</h2>
      <div class="grid2">
        ${DATA.exitTicket.map(x=>`<div><label>${esc(x.prompt)}</label><textarea id="${esc(x.id)}"></textarea></div>`).join("")}
      </div>
    </section>

    <div id="result"></div>

    <div class="actions">
      <button class="secondary" onclick="saveLocal()">💾 Lưu bài</button>
      <button class="primary" onclick="submitQuiz()">📤 Nộp bài</button>
      <button class="danger" onclick="resetQuiz()">↻ Làm lại</button>
    </div>
    <div class="footer">Mẫu phiếu học tập động • Nội dung tách riêng khỏi giao diện và chức năng.</div>
  `;
  app.innerHTML = html;
  initDragDrop();
  loadLocal();
}

function renderSection(sec){
  if(sec.type==="mcq"){
    return `<section class="card" id="${esc(sec.id)}">
      <h2>🟣 ${esc(sec.title)}</h2>
      ${sec.instruction?`<p class="note">${esc(sec.instruction)}</p>`:""}
      ${sec.items.map((it,idx)=>`
        <div class="q" data-item="${esc(it.id)}" data-type="mcq">
          <strong>Câu ${idx+1}. ${esc(it.question)}</strong>
          ${it.options.map((op,i)=>`<label class="option"><input type="radio" name="${esc(it.id)}" value="${i}">${String.fromCharCode(65+i)}. ${esc(op)}</label>`).join("")}
          <div class="feedback"></div>
        </div>`).join("")}
      <button class="checkbtn" onclick="checkSection('${esc(sec.id)}')">🔎 Kiểm tra phần này</button>
    </section>`;
  }

  if(sec.type==="trueFalse"){
    return `<section class="card" id="${esc(sec.id)}">
      <h2>🔵 ${esc(sec.title)}</h2>
      ${sec.items.map((it,idx)=>`
        <div class="q" data-item="${esc(it.id)}" data-type="trueFalse">
          <strong>${String.fromCharCode(97+idx)}. ${esc(it.question)}</strong>
          <label class="option"><input type="radio" name="${esc(it.id)}" value="true">Đúng</label>
          <label class="option"><input type="radio" name="${esc(it.id)}" value="false">Sai</label>
          <div class="feedback"></div>
        </div>`).join("")}
      <button class="checkbtn" onclick="checkSection('${esc(sec.id)}')">🔎 Kiểm tra phần này</button>
    </section>`;
  }

  if(sec.type==="fillBlank"){
    return `<section class="card" id="${esc(sec.id)}">
      <h2>🟣 ${esc(sec.title)}</h2>
      <div class="grid2">
      ${sec.items.map((it,idx)=>`<div><label>${idx+1}. ${esc(it.prompt)}</label><input id="${esc(it.id)}" type="text"></div>`).join("")}
      </div>
      <div class="feedback section-feedback"></div>
      <button class="checkbtn" onclick="checkSection('${esc(sec.id)}')">🔎 Kiểm tra phần này</button>
    </section>`;
  }

  if(sec.type==="matching"){
    return `<section class="card" id="${esc(sec.id)}">
      <h2>🔵 ${esc(sec.title)}</h2>
      ${sec.items.map((it,idx)=>`
        <div class="match-row">
          <b>${idx+1}. ${esc(it.left)}</b>
          <select id="${esc(it.id)}">
            <option value="">-- Chọn --</option>
            ${sec.choices.map((c,i)=>`<option value="${i}">${String.fromCharCode(65+i)}. ${esc(c)}</option>`).join("")}
          </select>
        </div>`).join("")}
      <div class="feedback section-feedback"></div>
      <button class="checkbtn" onclick="checkSection('${esc(sec.id)}')">🔎 Kiểm tra phần này</button>
    </section>`;
  }

  if(sec.type==="dragDrop"){
    return `<section class="card" id="${esc(sec.id)}">
      <h2>🧩 ${esc(sec.title)}</h2>
      ${sec.instruction?`<p class="note">${esc(sec.instruction)}</p>`:""}
      <div class="drag-area">
        <div class="bank" data-bank="${esc(sec.id)}">
          <h3>Kho khái niệm</h3>
          ${sec.items.map(it=>`<div class="chip" id="chip_${esc(it.id)}" draggable="true" data-drag-id="${esc(it.id)}" data-section="${esc(sec.id)}">${esc(it.label)}</div>`).join("")}
        </div>
        <div class="targets">
          <h3>Vị trí đúng</h3>
          ${sec.items.map(it=>`
            <div class="dropzone" data-answer="${esc(it.id)}" data-section="${esc(sec.id)}">
              <div class="drop-title">${esc(it.target)}</div>
              <div class="drop-slot">Thả khái niệm vào đây</div>
            </div>`).join("")}
        </div>
      </div>
      <div class="success-pop" data-drag-feedback="${esc(sec.id)}">Chính xác! 🎉</div>
    </section>`;
  }

  if(sec.type==="openText"){
    return `<section class="card" id="${esc(sec.id)}">
      <h2>🧪 ${esc(sec.title)}</h2>
      ${sec.intro?`<p>${esc(sec.intro)}</p>`:""}
      ${sec.items.map((it,idx)=>`
        <div class="q">
          <label><b>${idx+1}. ${esc(it.prompt)}</b></label>
          ${it.multiline?`<textarea id="${esc(it.id)}" placeholder="${esc(it.placeholder||"")}"></textarea>`:`<input id="${esc(it.id)}" type="text" placeholder="${esc(it.placeholder||"")}">`}
        </div>`).join("")}
    </section>`;
  }
  return "";
}

function sectionById(id){ return DATA.sections.find(s=>s.id===id); }

function checkSection(sectionId){
  const sec = sectionById(sectionId);
  if(!sec) return 0;
  let score=0;

  if(sec.type==="mcq" || sec.type==="trueFalse"){
    sec.items.forEach(it=>{
      const chosen = document.querySelector(`input[name="${CSS.escape(it.id)}"]:checked`);
      const box = document.querySelector(`[data-item="${CSS.escape(it.id)}"] .feedback`);
      document.querySelectorAll(`input[name="${CSS.escape(it.id)}"]`).forEach(inp=>{
        const label=inp.closest(".option");
        label.classList.remove("correct","wrong");
        const correctValue = sec.type==="mcq" ? String(it.answer) : String(it.answer);
        if(inp.value===correctValue) label.classList.add("correct");
        if(chosen && inp.checked && inp.value!==correctValue) label.classList.add("wrong");
      });
      if(!chosen){
        box.textContent="Chưa chọn đáp án."; box.className="feedback wrong-text";
      } else if(chosen.value===String(it.answer)){
        score++; box.textContent="✓ Chính xác"; box.className="feedback correct-text";
      } else {
        box.textContent="✗ Chưa đúng"; box.className="feedback wrong-text";
      }
    });
  }

  if(sec.type==="fillBlank"){
    sec.items.forEach(it=>{
      const el=document.getElementById(it.id);
      const v=norm(el.value).replace(/\s/g,"");
      const ok=it.answers.some(a=>norm(a).replace(/\s/g,"")===v);
      el.style.borderColor=ok?"#86efac":"#fecaca";
      el.style.background=ok?"#f0fdf4":"#fff1f2";
      if(ok) score++;
    });
    const f=document.querySelector(`#${CSS.escape(sec.id)} .section-feedback`);
    f.textContent=`Điền khuyết: ${score}/${sec.items.length} câu đúng.`;
    f.className="feedback section-feedback "+(score===sec.items.length?"correct-text":"wrong-text");
  }

  if(sec.type==="matching"){
    sec.items.forEach(it=>{
      const el=document.getElementById(it.id);
      const ok=el.value===String(it.answer);
      el.style.borderColor=ok?"#86efac":"#fecaca";
      el.style.background=ok?"#f0fdf4":"#fff1f2";
      if(ok) score++;
    });
    const f=document.querySelector(`#${CSS.escape(sec.id)} .section-feedback`);
    f.textContent=`Nối cột: ${score}/${sec.items.length} câu đúng.`;
    f.className="feedback section-feedback "+(score===sec.items.length?"correct-text":"wrong-text");
  }

  if(sec.type==="dragDrop"){
    score=document.querySelectorAll(`#${CSS.escape(sec.id)} .dropzone.correct`).length;
  }

  return score;
}

function initDragDrop(){
  document.querySelectorAll(".chip").forEach(chip=>{
    chip.addEventListener("dragstart",e=>{
      if(chip.classList.contains("locked")){e.preventDefault();return;}
      e.dataTransfer.setData("text/plain",chip.id);
    });
    chip.addEventListener("click",()=>{
      if(chip.classList.contains("locked"))return;
      document.querySelectorAll(".chip").forEach(c=>c.classList.remove("selected"));
      state.selectedChip=chip; chip.classList.add("selected");
    });
  });

  document.querySelectorAll(".dropzone").forEach(zone=>{
    zone.addEventListener("dragover",e=>{e.preventDefault();if(!zone.classList.contains("correct"))zone.classList.add("dragover");});
    zone.addEventListener("dragleave",()=>zone.classList.remove("dragover"));
    zone.addEventListener("drop",e=>{
      e.preventDefault();zone.classList.remove("dragover");
      handleDrop(document.getElementById(e.dataTransfer.getData("text/plain")),zone);
    });
    zone.addEventListener("click",()=>{if(state.selectedChip)handleDrop(state.selectedChip,zone);});
  });
}

function handleDrop(chip,zone){
  if(!chip || chip.classList.contains("locked") || zone.classList.contains("correct"))return;
  const feedback=document.querySelector(`[data-drag-feedback="${CSS.escape(zone.dataset.section)}"]`);
  if(chip.dataset.dragId===zone.dataset.answer){
    const slot=zone.querySelector(".drop-slot");
    slot.innerHTML="";slot.appendChild(chip);
    chip.classList.add("locked");chip.classList.remove("selected");chip.draggable=false;
    zone.classList.add("correct");state.selectedChip=null;
    feedback.textContent="Chính xác! 🎉";feedback.style.display="block";
    feedback.style.background="#dcfce7";feedback.style.color="#166534";
    setTimeout(()=>feedback.style.display="none",1100);
  } else {
    zone.classList.add("shake");
    setTimeout(()=>zone.classList.remove("shake"),350);
    feedback.textContent="Chưa đúng, hãy thử lại!";
    feedback.style.display="block";feedback.style.background="#fee2e2";feedback.style.color="#991b1b";
    setTimeout(()=>feedback.style.display="none",900);
  }
}

function submitQuiz(){
  let score=0,total=0;
  autoSections().forEach(sec=>{ score += checkSection(sec.id); total += sec.items.length; });

  const percent=total?Math.round(score/total*100):0;
  const name=(document.getElementById("student_0")?.value||"").trim();
  const result=document.getElementById("result");
  result.style.display="block";

  if(percent>=DATA.scoring.thresholds.excellent){
    result.className="ok";
    result.innerHTML=`🎉 ${name?esc(name)+": ":""}Em đạt <b>${score}/${total}</b> điểm chấm tự động (${percent}%). Rất tốt!`;
  } else if(percent>=DATA.scoring.thresholds.pass){
    result.className="warn";
    result.innerHTML=`👍 ${name?esc(name)+": ":""}Em đạt <b>${score}/${total}</b> điểm chấm tự động (${percent}%). Hãy xem lại các phần chưa đúng.`;
  } else {
    result.className="bad";
    result.innerHTML=`📘 ${name?esc(name)+": ":""}Em đạt <b>${score}/${total}</b> điểm chấm tự động (${percent}%). Hãy đọc lại phần Ghi nhớ và thử lại.`;
  }

  document.querySelectorAll('input[type="radio"]').forEach(inp=>{inp.disabled=true;inp.closest(".option")?.classList.add("locked");});
  saveLocal(false);
  result.scrollIntoView({behavior:"smooth",block:"center"});
}

function collectState(){
  const out={fields:{},dragged:[]};
  document.querySelectorAll("input,textarea,select").forEach(el=>{
    if(el.type==="radio"){if(el.checked)out.fields["radio:"+el.name]=el.value;}
    else if(el.id) out.fields["id:"+el.id]=el.value;
  });
  document.querySelectorAll(".dropzone.correct").forEach(z=>out.dragged.push({section:z.dataset.section,item:z.dataset.answer}));
  return out;
}

function saveLocal(showAlert=true){
  localStorage.setItem("dynamic_lesson_template_v1",JSON.stringify(collectState()));
  if(showAlert)alert("Đã lưu bài trên trình duyệt này.");
}

function loadLocal(){
  const raw=localStorage.getItem("dynamic_lesson_template_v1");
  if(!raw)return;
  try{
    const saved=JSON.parse(raw);
    Object.entries(saved.fields||{}).forEach(([k,v])=>{
      if(k.startsWith("id:")){const el=document.getElementById(k.slice(3));if(el)el.value=v;}
      else if(k.startsWith("radio:")){
        const name=k.slice(6);
        const el=document.querySelector(`input[name="${CSS.escape(name)}"][value="${CSS.escape(v)}"]`);
        if(el)el.checked=true;
      }
    });
    (saved.dragged||[]).forEach(d=>{
      const chip=document.querySelector(`.chip[data-section="${CSS.escape(d.section)}"][data-drag-id="${CSS.escape(d.item)}"]`);
      const zone=document.querySelector(`.dropzone[data-section="${CSS.escape(d.section)}"][data-answer="${CSS.escape(d.item)}"]`);
      if(chip&&zone)handleDrop(chip,zone);
    });
  }catch(e){}
}

function resetQuiz(){
  if(!confirm("Xóa toàn bộ câu trả lời và làm lại từ đầu?"))return;
  localStorage.removeItem("dynamic_lesson_template_v1");
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
